name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 15 \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n=== Downloaded bytes: %{size_download} ===\n=== Final URL: %{url_effective} ===\n"

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip
          echo ""
          echo "=== File Type ==="
          file project.zip
          echo ""
          echo "=== First Bytes ==="
          xxd -l 64 project.zip

      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="
          ATTEMPT=1
          while [ "$ATTEMPT" -le 3 ] && ! unzip -t project.zip > /dev/null 2>&1; do
            echo "⚠️  ZIP belum valid (percobaan $ATTEMPT/3), retry download (transfer mungkin putus di tengah jalan / asset belum ready)..."
            sleep $((ATTEMPT * 5))
            curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 15 \
              -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              "${{ github.event.inputs.zip_url }}" \
              -o project.zip \
              -w "\n=== Retry HTTP Status: %{http_code} ===\n=== Downloaded bytes: %{size_download} ===\n"
            ATTEMPT=$((ATTEMPT + 1))
          done

          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid setelah 3x percobaan!"
            echo ""
            echo "=== Info file (aman, bukan isi mentah) ==="
            file project.zip
            ls -lh project.zip
            echo ""
            echo "=== 64 byte pertama (hex) ==="
            xxd -l 64 project.zip
            exit 1
          fi
          echo "✅ ZIP valid"


          echo ""
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Membersihkan Sampah ZIP (macOS dll) ==="
          rm -rf project_raw/__MACOSX
          find project_raw -maxdepth 1 -type f -name ".*" -delete

          echo ""
          echo "=== Mengunci Project Dir ==="
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: "stable"
          cache: true

      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          if [ -f "pubspec.yaml" ]; then
            set +e
            flutter analyze > analyze_report.txt 2>&1
            ANALYZE_EXIT=$?
            set -e
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
            rm -f analyze_report.txt
            echo "ANALYZE_EXIT=$ANALYZE_EXIT" >> $GITHUB_ENV
          else
            echo "[RESULT_ANALYZE]"
            echo "❌ pubspec.yaml tidak ditemukan."
            echo "[END_RESULT_ANALYZE]"
            echo "ANALYZE_EXIT=1" >> $GITHUB_ENV
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit ${{ env.ANALYZE_EXIT }}

      - name: Prepare Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          if [ ! -f "pubspec.yaml" ]; then
            echo "No pubspec.yaml, skip Flutter prep"
            exit 0
          fi

          # Pastikan folder android ada
          if [ ! -d "android" ]; then
            echo "Folder android tidak ada, generate..."
            flutter create --platforms=android .
          fi

          PROP_FILE="android/gradle.properties"
          touch "$PROP_FILE"
          sed -i "/^android.builtInKotlin=/d" "$PROP_FILE" 2>/dev/null || true
          sed -i "/^android.newDsl=/d" "$PROP_FILE" 2>/dev/null || true
          sed -i "/^android.defaults.buildfeatures.buildconfig=/d" "$PROP_FILE" 2>/dev/null || true
          sed -i "/^android.nonTransitiveRClass=/d" "$PROP_FILE" 2>/dev/null || true
          sed -i "/^org.gradle.jvmargs=/d" "$PROP_FILE" 2>/dev/null || true
          sed -i "/^android.enableR8.fullMode=/d" "$PROP_FILE" 2>/dev/null || true
          {
            echo "android.builtInKotlin=false"
            echo "android.newDsl=false"
            echo "android.defaults.buildfeatures.buildconfig=true"
            echo "android.nonTransitiveRClass=false"
            echo "android.enableR8.fullMode=false"
            echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError"
            echo "org.gradle.parallel=true"
          } >> "$PROP_FILE"

          # Patch AGP 9 -> 8.7.2 di settings
          for SF in android/settings.gradle android/settings.gradle.kts; do
            if [ -f "$SF" ]; then
              sed -i -E "s/version[[:space:]]+['\"]9\.[0-9.]+['\"]/version \"8.7.2\"/g" "$SF" 2>/dev/null || true
            fi
          done

          # Patch classpath AGP di build.gradle lama
          for BF in android/build.gradle android/build.gradle.kts; do
            if [ -f "$BF" ]; then
              sed -i -E "s/com\.android\.tools\.build:gradle:9\.[0-9.]+/com.android.tools.build:gradle:8.7.2/g" "$BF" 2>/dev/null || true
            fi
          done

          echo "=== gradle.properties ==="
          cat "$PROP_FILE"

          echo "=== flutter pub get ==="
          set +e
          flutter pub get
          PUB_EXIT=$?
          set -e
          if [ "$PUB_EXIT" -ne 0 ]; then
            echo "pub get gagal, coba flutter clean + pub get..."
            flutter clean || true
            flutter pub get || true
          fi

      - name: Build APK (multi-fallback)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then BUILD_TYPE="release"; fi

          build_once() {
            local mode="$1"
            local extra="$2"
            echo ""
            echo "=========================================="
            echo " TRY: flutter build apk --$mode $extra"
            echo "=========================================="
            flutter build apk --$mode $extra
            return $?
          }

          SUCCESS=0
          if [ -f "pubspec.yaml" ]; then
            # Urutan fallback: requested -> no-tree-shake -> debug -> debug no-tree-shake
            if build_once "$BUILD_TYPE" ""; then
              SUCCESS=1
            elif build_once "$BUILD_TYPE" "--no-tree-shake-icons"; then
              SUCCESS=1
            elif [ "$BUILD_TYPE" != "debug" ] && build_once "debug" ""; then
              SUCCESS=1
            elif build_once "debug" "--no-tree-shake-icons"; then
              SUCCESS=1
            fi
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -n "$GRADLE_PATH" ]; then
              GRADLE_DIR=$(dirname "$GRADLE_PATH")
              cd "$GRADLE_DIR" && chmod +x gradlew
              ./gradlew assembleRelease || ./gradlew assembleDebug
              [ $? -eq 0 ] && SUCCESS=1
            fi
          fi
          set -e

          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ Semua strategi build gagal"
            exit 1
          fi
          echo "✅ Build sukses"

      - name: Check APK Output
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "❌ Tidak ada file APK hasil build"
            find $GITHUB_WORKSPACE -type f -name "*.apk" -o -name "*.aab" 2>/dev/null | head -20
            exit 1
          fi
          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "APK ditemukan: $APK_PATH"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          ls -lh "$APK_FOUND"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error